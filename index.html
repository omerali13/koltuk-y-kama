<!DOCTYPE html>

        .btn-whatsapp { background-color: #25d366; color: white; padding: 18px 35px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 1.2em; transition: 0.3s; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); margin-top: 20px; }
        .btn-whatsapp:hover { transform: scale(1.05); }
        footer { text-align: center; padding: 30px; color: #888; font-size: 0.9em; }
    </style>
</head>
